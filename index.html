<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>현우의 받아쓰기 연습</title>
  <meta name="description" content="현우의 받아쓰기 연습 - 회차별 받아쓰기 음성 듣기 연습 사이트" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title"><span class="emoji">✏️</span>현우의 받아쓰기 연습</h1>
    <div class="header-controls">
      <div class="voice-select-wrap">
        <label for="voiceSelect">🎙️</label>
        <select id="voiceSelect"></select>
        <button id="voiceRefreshBtn" type="button" aria-label="목소리 다시 찾기" title="목소리 다시 찾기">🔄</button>
      </div>
      <button id="settingsBtn" class="home-btn" type="button">
        <span>⚙️</span><span>설정</span>
      </button>
      <button id="homeBtn" class="home-btn" type="button" style="visibility: hidden">
        <span>🏠</span><span>회차 목록</span>
      </button>
    </div>
  </header>

  <main id="main"></main>

  <footer class="app-footer">받아쓰기 음성은 이 기기의 브라우저 음성 기능을 사용해요 🔊</footer>

  <div id="settingsBackdrop" class="settings-backdrop" hidden>
    <div class="settings-modal" role="dialog" aria-label="음성 설정">
      <div class="settings-modal-head">
        <h2>음성 설정</h2>
        <button id="settingsCloseBtn" class="icon-btn close-btn" type="button" aria-label="설정 닫기">✕</button>
      </div>

      <div class="settings-row">
        <div class="settings-label">
          <span>재생 속도</span>
          <span id="rateValue" class="settings-value">1.00배</span>
        </div>
        <input id="rateRange" type="range" min="0.5" max="1.3" step="0.05" value="1" />
        <div class="settings-hint">느리게 ─────── 빠르게</div>
      </div>

      <div class="settings-row">
        <div class="settings-label">
          <span>띄어쓰기 간격</span>
          <span id="pauseValue" class="settings-value">자연스럽게 이어 읽기</span>
        </div>
        <input id="pauseRange" type="range" min="0" max="0.5" step="0.02" value="0" />
        <div class="settings-hint">자연스럽게 이어 읽기 ─────── 또박또박 끊어 읽기</div>
      </div>

      <button id="settingsResetBtn" class="reset-btn" type="button">기본값으로 되돌리기</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
